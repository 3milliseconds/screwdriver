name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        id: package
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^\d+\.\d+\.\d+$/.test(version) || tag !== `v${version}`) {
            console.error(`Release tag ${tag} must match package.json version v${version}.`);
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact=${name}-${version}.zip\n`);
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check, build, and package
        run: npm run package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.package.outputs.artifact }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
